<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf8fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0c11" media="(prefers-color-scheme: dark)" />
    <title>Levo · encurte links e acompanhe cada clique</title>
    <!-- Aplica o tema escolhido antes de desenhar a página, para não piscar no tema errado.
         A chave é a mesma de src/theme.ts. -->
    <script>
      try {
        var theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
          var color = theme === 'dark' ? '#0e0c11' : '#faf8fb'
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.content = color
          })
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
