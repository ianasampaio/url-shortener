[project]
name = "url-shortener"
version = "0.1.0"
description = "URL shortener with FastAPI and MongoDB"
requires-python = ">=3.11"
dependencies = [
    "crawlerdetect>=0.4.2",
    "email-validator>=2.3.0",
    "fastapi>=0.143.3",
    "geoip2>=5.3.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "pymongo>=4.19.0",
    "redis>=8.1.0",
    "rq>=2.12.0",
    "user-agents>=2.2.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
